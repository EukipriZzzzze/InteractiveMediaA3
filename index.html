    <style>
        body {
            margin: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #clouds, #ascended {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        #ascended {
            z-index: 2;
            background: white;
            opacity: 0;
        }
    </style>
</head>

<body>
<canvas id="myCanvas"></canvas>
<div id="clouds" aria-hidden="true"></div>
<div id="ascended" aria-hidden="true"></div>
